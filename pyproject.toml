[project]
name = "bio-claim-check"
version = "0.0.1"
description = "Does this agent's answer hold up? Checks life-science agent claims against the abstracts they cite, with planted traps that measure what the verifier catches."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Samir Guliyev", email = "63205250+squliyev@users.noreply.github.com" }
]
requires-python = ">=3.13"
keywords = ["claim verification", "life science", "llm evaluation", "europe pmc", "drug discovery"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14",
    "typer>=0.15",
]

[project.scripts]
bio-claim-check = "bio_claim_check.app.cli:app"

[build-system]
requires = ["hatchling==1.32.4"]  # exact: build backend is not in uv.lock; Dependabot proposes bumps
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "grimp>=3.17",  # import graph for the ancestor-import guard (tests/support/guards.py)
    "import-linter==2.15.*",  # the rule-fire harness asserts on its CLI output format
    "packaging>=26.0",  # parses [project].dependencies in the dependency-policy test
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# BLE/E722: no blind except · T20: no print · TID251: banned APIs · S: bandit · PTH: pathlib
select = ["E", "W", "F", "I", "B", "UP", "SIM", "BLE", "T20", "S", "TID", "RUF", "PTH", "N", "C4", "PT", "RET"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through bio_claim_check.app.settings only (ADR 0001)."
"os.getenv".msg = "Read configuration through bio_claim_check.app.settings only (ADR 0001)."
"os.putenv".msg = "Read configuration through bio_claim_check.app.settings only (ADR 0001)."
"tests".msg = "Production code never imports test support (ADR 0002)."
"importlib.import_module".msg = "Import statically so the import rules can see it (ADR 0007)."
"datetime.date.today".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"datetime.datetime.now".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"datetime.datetime.today".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"datetime.datetime.utcnow".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"random".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"secrets".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"os.getrandom".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"os.urandom".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"time.monotonic".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"time.monotonic_ns".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"time.perf_counter".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"time.perf_counter_ns".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"time.time".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"time.time_ns".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"uuid.uuid1".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."
"uuid.uuid4".msg = "Canonical artifacts must be byte-identical: inject a Clock or seed instead (ADR 0007)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TID251"]  # tests may import tests.support; the ban stays active in src/**

# ---------------------------------------------------------------- import-linter
# Every contract has an `id`; tests/arch/test_rules_fire.py proves each one fails on a planted violation.
[tool.importlinter]
root_package = "bio_claim_check"
include_external_packages = true  # lets `pure-modules-import-no-drivers` see third-party and stdlib imports

[[tool.importlinter.contracts]]
id = "rings"
name = "Rings point inward (ADR 0002)"
type = "layers"
layers = [
    "bio_claim_check.app",
    "bio_claim_check.infrastructure",
    "bio_claim_check.features",
    "bio_claim_check.engine",
    "bio_claim_check.common",
]

[[tool.importlinter.contracts]]
id = "slices"
name = "Feature slices are independent; only features.contracts is shared (ADR 0002)"
type = "independence"
modules = [
    "bio_claim_check.features.annotate",
    "bio_claim_check.features.answer",
    "bio_claim_check.features.baselines",
    "bio_claim_check.features.bench",
    "bio_claim_check.features.checks",
    "bio_claim_check.features.report",
    "bio_claim_check.features.retrieval",
    "bio_claim_check.features.traps",
    "bio_claim_check.features.verify",
]

[[tool.importlinter.contracts]]
# Sources mirror the "No LLM is involved" docstring markers exactly (tests/arch: marker parity).
id = "no-llm-in-deterministic-code"
name = "Deterministic code never calls an LLM (ADR 0003)"
type = "forbidden"
source_modules = [
    "bio_claim_check.common",
    "bio_claim_check.engine.events",
    "bio_claim_check.features.annotate.agreement",
    "bio_claim_check.features.answer.base_answerer",
    "bio_claim_check.features.answer.scripted_answerer",
    "bio_claim_check.features.bench.stats",
    "bio_claim_check.features.checks",
    "bio_claim_check.features.contracts",
    "bio_claim_check.features.report",
    "bio_claim_check.features.retrieval.base_literature_source",
    "bio_claim_check.features.retrieval.in_memory_literature_source",
    "bio_claim_check.features.verify.base_verifier",
    "bio_claim_check.features.verify.scripted_verifier",
    "bio_claim_check.infrastructure",
]
forbidden_modules = ["bio_claim_check.engine.llm"]

[[tool.importlinter.contracts]]
id = "contracts-do-not-depend-on-slices"
name = "features.contracts depends on no feature slice (ADR 0002)"
type = "forbidden"
source_modules = ["bio_claim_check.features.contracts"]
forbidden_modules = [
    "bio_claim_check.features.annotate",
    "bio_claim_check.features.answer",
    "bio_claim_check.features.baselines",
    "bio_claim_check.features.bench",
    "bio_claim_check.features.checks",
    "bio_claim_check.features.report",
    "bio_claim_check.features.retrieval",
    "bio_claim_check.features.traps",
    "bio_claim_check.features.verify",
]

[[tool.importlinter.contracts]]
id = "no-cycles"
name = "No import cycles between sibling modules at any depth (ADR 0002)"
type = "acyclic_siblings"
ancestors = ["bio_claim_check"]
depth = 10

[[tool.importlinter.contracts]]
# Pure kinds only. Elsewhere in common/engine/features a driver may be imported only by a backend module
# (`<backend>_<x>.py` beside `base_<x>.py`); tests/support/guards.check_driver_imports enforces that.
id = "pure-modules-import-no-drivers"
name = "Pure modules import no driver libraries (ADR 0002, ADR 0007)"
type = "forbidden"
source_modules = [
    "bio_claim_check.common",
    "bio_claim_check.engine.events",
    "bio_claim_check.features.annotate.agreement",
    "bio_claim_check.features.bench.stats",
    "bio_claim_check.features.checks",
    "bio_claim_check.features.contracts",
    "bio_claim_check.features.report",
]
forbidden_modules = [
    "anthropic",
    "httpx",
    "openai",
    "pydantic_settings",
    "sqlite3",
    "streamlit",
    "tenacity",
    "typer",
    "yaml",
]

[[tool.importlinter.contracts]]
id = "engine-is-feature-agnostic"
name = "The engine is the feature-agnostic core runtime: it never imports features (ADR 0002, ADR 0007)"
type = "forbidden"
source_modules = ["bio_claim_check.engine"]
forbidden_modules = ["bio_claim_check.features", "bio_claim_check.infrastructure", "bio_claim_check.app"]

[[tool.importlinter.contracts]]
id = "infrastructure-holds-only-transport"
name = "Infrastructure holds only generic transport: no feature or engine imports (ADR 0007)"
type = "forbidden"
source_modules = ["bio_claim_check.infrastructure"]
forbidden_modules = ["bio_claim_check.features", "bio_claim_check.engine"]

[[tool.importlinter.contracts]]
id = "driving-adapters-use-the-container"
name = "CLI and UI reach infrastructure only through app.container (ADR 0002)"
type = "forbidden"
source_modules = ["bio_claim_check.app.cli", "bio_claim_check.app.ui"]
forbidden_modules = ["bio_claim_check.infrastructure"]
allow_indirect_imports = true  # the container is the one sanctioned path

[[tool.importlinter.contracts]]
id = "usecases-are-interface-free"
name = "Use cases receive ports; they never import interfaces, the container or infrastructure (ADR 0002)"
type = "forbidden"
source_modules = ["bio_claim_check.app.usecases"]
forbidden_modules = [
    "bio_claim_check.app.cli",
    "bio_claim_check.app.container",
    "bio_claim_check.app.ui",
    "bio_claim_check.infrastructure",
]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"   # every implementation of a base says so (ADR 0007)
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]  # makes `tests.support` importable (tests only; src never imports it)
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: fast, offline, no I/O beyond tmp_path",
    "contract: shared port scenarios run against every implementation",
    "arch: architecture rules and guards",
    "e2e: the whole offline flow through the CLI, incl. the installed console script",
    "live: real network/LLM calls; opt-in only, never in CI",
]

[tool.coverage.run]
source = ["bio_claim_check"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
