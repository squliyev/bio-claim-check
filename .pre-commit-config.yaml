# Runs before every commit (`make hooks`). Tools come from uv.lock so hooks == CI versions.
# Remote hooks are pinned by commit SHA (supply-chain hygiene); Dependabot/`pre-commit autoupdate` bumps them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        # Sealed split files: SEALED hashes their exact bytes, so they cannot be split or compressed (ADR 0010).
        exclude: ^datasets/(dev|test)/sources\.jsonl$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright (strict)
        entry: uv run --frozen pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
