version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
